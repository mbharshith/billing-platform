<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Placeholder title only — replaced at runtime by AppShell using
         BRAND.fullTitle from src/shared/brand.ts. Keep it generic so the
         static HTML never leaks a stale product name after a rebrand. -->
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script>
      // Set theme before paint to prevent light-flash on dark reloads.
      (function () {
        try {
          var stored = localStorage.getItem('app-theme');
          var systemPrefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = (stored === 'dark' || stored === 'light') ? stored : (systemPrefersDark ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
        } catch (_) {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
