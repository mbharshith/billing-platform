# =========================================================================
# Local + demo stack: MongoDB + Cashier API
# Run:   docker compose up -d
# Seed:  docker compose exec api npm run seed
# =========================================================================

services:
  mongo:
    image: mongo:7
    container_name: cashier-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build: .
    container_name: cashier-api
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: info
      MONGO_URI: mongodb://mongo:27017/cashier
      JWT_SECRET: ${JWT_SECRET:-change-me-please-and-make-it-long-random-and-uncommitted}
      JWT_EXPIRES_IN: 8h
      BCRYPT_ROUNDS: 10
      CORS_ORIGINS: http://localhost:4173,http://localhost:5173
      RATE_LIMIT_WINDOW_MS: 60000
      RATE_LIMIT_MAX: 300
      TAX_RATE: 0.0825
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_PASSWORD: Admin@12345
      SEED_CASHIER_USERNAME: cashier1
      SEED_CASHIER_PASSWORD: Cashier@123
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  mongo-data:
